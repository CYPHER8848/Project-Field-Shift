<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 30" width="100%" height="30" preserveAspectRatio="none">
  <defs>
    <pattern id="kasuti-pattern" width="40" height="30" patternUnits="userSpaceOnUse">
      <!-- Kasuti Gopura & Ratha Geometric Stitches (Karnataka Folk Needlework) -->
      <polygon points="20,2 38,15 20,28 2,15" fill="none" stroke="#A43C25" stroke-width="1.8" />
      <polygon points="20,6 31,15 20,24 9,15" fill="none" stroke="#DF9B1A" stroke-width="1.4" />
      <circle cx="20" cy="15" r="2.5" fill="#1F3825" />
      
      <!-- Stepped Chevron Cross-stitches -->
      <line x1="0" y1="2" x2="10" y2="2" stroke="#382A27" stroke-width="1.2" />
      <line x1="30" y1="2" x2="40" y2="2" stroke="#382A27" stroke-width="1.2" />
      <line x1="0" y1="28" x2="10" y2="28" stroke="#382A27" stroke-width="1.2" />
      <line x1="30" y1="28" x2="40" y2="28" stroke="#382A27" stroke-width="1.2" />

      <!-- Diagonal Corner Rays -->
      <line x1="0" y1="15" x2="8" y2="15" stroke="#A43C25" stroke-width="1.2" />
      <line x1="32" y1="15" x2="40" y2="15" stroke="#A43C25" stroke-width="1.2" />
    </pattern>
  </defs>
  <rect width="100%" height="30" fill="url(#kasuti-pattern)" />
</svg>
